[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "clash-net-lib"
version = "0.2.0"
description = "The public shape contract for the Clash Net Protocol (CNP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Martin Miglio", email = "martin@pyclashbot.app" }]
keywords = ["clash-royale", "contract", "protocol", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
client = ["websockets>=13,<16"]
validate = ["jsonschema>=4.23"]
test = ["pytest>=8.3", "jsonschema>=4.23", "ruff>=0.6", "websockets>=13,<16"]

[project.scripts]
clashnet-conformance = "clashnet.conformance:main"

[project.urls]
Homepage = "https://github.com/pyclashbot/clash-net-lib"
Source = "https://github.com/pyclashbot/clash-net-lib"

[tool.hatch.build.targets.wheel]
packages = ["src/clashnet"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/CONTRACT.md", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
